name: create release
on:
  push:
    branches:
      - main
permissions:
  pull-requests: write
  contents: write
  issues: write
jobs:
  create-executable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build executable
        run: npm run build
      - uses: actions/upload-artifact@v7
        name: spectral-cli-bin-linux-x64
        path: bin/spectral-cli-bin-linux-x64
        

  release:
    needs: create-executable
    uses: entur/gha-meta/.github/workflows/release.yml@v1

  attach-release-asset
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v7
        name: spectral-cli-bin-linux-x64
        path: bin/spectral-cli-bin-linux-x64
      - name: attach executable to release
        run: |
          gh release upload $RELEASE_TAG bin/spectral-cli-bin-linux-x64

