name: create release
on:
  push:
    branches:
      - main
permissions:
  pull-requests: write
  contents: write
  issues: write
jobs:
  release:
    uses: entur/gha-meta/.github/workflows/release.yml@v1
    with:
      release_type: node

  create-executable:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build executable
        run: npm run build
      - name: attach executable to release
        shell: bash
        run: |
          filename_with_version="bin/spectral-cli-bin_${RELEASE_TAG}_linux-x64"
          mv bin/spectral-cli-bin_linux-x64 ${filename_with_version}
          gh release upload $RELEASE_TAG $filename_with_version

