name: ci
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  create-executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build executable
        run: npm run build
      - name: run executable
        shell: bash
        run: |
          bin/spectral-cli-bin_linux-x64 --version

